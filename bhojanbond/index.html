<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhojanBond</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>BHOJANBOND</h1>
<p>Share Food. Share Hope.</p>

<form id="donationForm">

<input type="text" id="name" placeholder="Donor Name" required>

<input type="text" id="food" placeholder="Food Item" required>

<input type="number" id="quantity" placeholder="Quantity" required>

<input type="text" id="location" placeholder="Pickup Location" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<button type="submit">Donate Food</button>

</form>

<div id="status"></div>

</div>

<script src="script.js"></script>

</body>
</html>
